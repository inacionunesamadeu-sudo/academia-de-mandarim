
name: Criar APK da Academia de Mandarim

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  construir-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Obter projeto
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Preparar Android
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: false

      - name: Aceitar licenças Android
        run: yes | sdkmanager --licenses

      - name: Criar projeto Android
        run: |
          mkdir -p www
          cp index.html style.css *.js *.png *.jpg *.jpeg *.webp *.m4a www/ 2>/dev/null || true
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "Academia de Mandarim" mz.academia.mandarim --web-dir www
          npx cap add android
          npx cap sync android

      - name: Construir APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Academia-de-Mandarim-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
