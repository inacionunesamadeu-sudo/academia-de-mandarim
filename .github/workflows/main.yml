
name: Criar APK da Academia de Mandarim

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  construir-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Obter projeto
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Preparar Android
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: false
          packages: platform-tools

      - name: Aceitar licenças Android
        run: yes | sdkmanager --licenses

      - name: Instalar componentes Android
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Criar projeto Android
        run: |
          mkdir -p www
          mkdir -p assets

          cp index.html style.css *.js *.png *.jpg *.jpeg *.webp *.m4a www/ 2>/dev/null || true

          ICON_FILE=$(find . -type f \( -name "ícone-mandarim-academia.png" -o -name "academia-mandarim-icon.png" \) -not -path "./.git/*" | head -n 1)

          if [ -z "$ICON_FILE" ]; then
            echo "ERRO: Imagem do ícone não encontrada."
            find . -type f -iname "*.png"
            exit 1
          fi

          echo "Ícone encontrado: $ICON_FILE"
          cp "$ICON_FILE" assets/icon.png

          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npm install @capacitor-community/text-to-speech@4.0.2 esbuild
          npm install --save-dev @capacitor/assets

          npx esbuild tts.js --bundle --platform=browser --format=iife --outfile=www/tts.bundle.js

          npx cap init "Academia de Mandarim" mz.academia.mandarim --web-dir www
          npx cap add android

          npx capacitor-assets generate --android

          npx cap sync android

      - name: Construir APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Academia-de-Mandarim-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
